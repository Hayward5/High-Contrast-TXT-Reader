<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高對比智慧型小說閱讀器 (TTS朗讀版)</title>
    <style>
        :root {
            /* Windows 高對比風格配色 */
            --bg-color: #000000;       /* 純黑背景 */
            --text-color: #FFFF00;     /* 亮黃文字 */
            --ui-border: #00FF00;      /* 亮綠邊框 */
            --ui-bg: #111111;          /* UI 深灰背景 */
            --highlight: #00FF00;      /* 強調色 */
            --alert-color: #FF0055;    /* 警告/停止色 */
            --font-size: 24px;
            --line-height: 1.6;
            --brightness: 1;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* 禁止整個頁面出現捲軸 */
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        /* --- 工具列 --- */
        #toolbar {
            background-color: var(--ui-bg);
            border-bottom: 2px solid var(--ui-border);
            padding: 10px 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 20;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label { 
            font-size: 14px; 
            color: #fff; 
            font-weight: bold;
        }

        /* 按鈕樣式 - 高對比風格 */
        button, .file-btn {
            background: #000;
            color: var(--ui-border);
            border: 2px solid var(--ui-border);
            padding: 6px 15px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.1s;
            text-transform: uppercase;
            min-width: 40px;
        }

        button:hover, .file-btn:hover {
            background: var(--ui-border);
            color: #000;
        }

        button:disabled {
            border-color: #555;
            color: #555;
            cursor: not-allowed;
            background: #000;
        }

        /* 特殊按鈕：停止朗讀 */
        button.reading-active {
            border-color: var(--alert-color);
            color: var(--alert-color);
            animation: pulse 1.5s infinite;
        }
        button.reading-active:hover {
            background: var(--alert-color);
            color: #fff;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 0, 85, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0); }
        }

        input[type="file"] { display: none; }
        
        /* 滑桿樣式 */
        input[type="range"] {
            width: 80px;
            accent-color: var(--ui-border);
            cursor: pointer;
        }

        /* --- 閱讀區域 (核心) --- */
        #reader-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden; /* 隱藏溢出，只顯示算好的那一頁 */
            width: 100%;
            margin: 0 auto;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
        }

        #reader-content {
            padding: 40px 60px; /* 閱讀文字邊距 */
            font-size: var(--font-size);
            line-height: var(--line-height);
            opacity: var(--brightness);
            white-space: pre-wrap; /* 保留原始換行 */
            text-align: justify;
            height: 100%; /* 充滿容器 */
            overflow: hidden; 
            word-break: break-all;
        }
        body[data-theme="dark"] { --bg-color:#121212; --text-color:#eee; --ui-border:#72d572; --ui-bg:#202020; }
        body[data-theme="paper"] { --bg-color:#f4ecd8; --text-color:#352f25; --ui-border:#765b35; --ui-bg:#e5d8bd; }
        body[data-theme="light"] { --bg-color:#fff; --text-color:#171717; --ui-border:#2459a6; --ui-bg:#eee; }
        body[data-mode="scroll"] #reader-wrapper { overflow-y:auto; }
        body[data-mode="scroll"] #reader-content { height:auto; min-height:100%; overflow:visible; text-align:left; }
        body[data-mode="scroll"] #prevBtn, body[data-mode="scroll"] #nextBtn { display:none; }
        :focus-visible { outline:3px solid #fff; outline-offset:2px; }
        #settings-panel { display:none; padding:8px 15px; background:var(--ui-bg); border-bottom:1px solid var(--ui-border); gap:12px; flex-wrap:wrap; align-items:center; }
        #settings-panel.open { display:flex; }
        #toolbar.hidden { display:none; }
        select { background:var(--bg-color); color:var(--text-color); border:1px solid var(--ui-border); padding:5px; }
        #announcement { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }

        /* --- 搜尋面板 --- */
        #search-panel {
            position: absolute;
            top: 0;
            right: -350px; /* 預設隱藏 */
            width: 350px;
            height: 100%;
            background: var(--ui-bg);
            border-left: 2px solid var(--ui-border);
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            z-index: 30;
            box-shadow: -10px 0 20px rgba(0,0,0,0.9);
        }

        #search-panel.open { right: 0; }

        .search-header {
            padding: 15px;
            border-bottom: 2px solid var(--ui-border);
            display: flex;
            gap: 5px;
            background: #000;
        }

        #searchInput {
            flex: 1;
            background: #000;
            border: 1px solid var(--ui-border);
            color: #fff;
            padding: 8px;
            font-size: 14px;
            outline: none;
        }
        
        #searchInput:focus {
            background: #222;
        }

        #search-results {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            background: #000;
        }

        /* 搜尋結果捲軸樣式 */
        #search-results::-webkit-scrollbar {
            width: 8px;
        }
        #search-results::-webkit-scrollbar-track {
            background: #000;
        }
        #search-results::-webkit-scrollbar-thumb {
            background: var(--ui-border);
        }

        .result-item {
            padding: 12px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            font-size: 14px;
            color: #aaa;
            line-height: 1.4;
        }
        .result-item:hover { 
            background: var(--ui-border); 
            color: #000; 
        }
        .result-item:hover .result-highlight {
            color: #000; /* 反白時高亮字變黑 */
            text-decoration: underline;
        }
        .result-highlight { 
            color: var(--ui-border); 
            font-weight: bold; 
            font-size: 1.1em;
        }

        /* --- 狀態列 --- */
        #statusbar {
            background-color: var(--ui-bg);
            border-top: 1px solid #333;
            padding: 5px 15px;
            font-size: 13px;
            color: #888;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            font-family: monospace;
        }

        /* 進度輸入框樣式 */
        .progress-control {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        #progress-input {
            background: transparent;
            color: var(--text-color);
            border: 1px solid #444;
            border-radius: 4px;
            width: 60px;
            text-align: right;
            font-family: monospace;
            font-size: 13px;
            padding: 2px 4px;
            outline: none;
            transition: border-color 0.2s;
        }

        #progress-input:focus {
            border-color: var(--ui-border);
            background: #222;
        }
        
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* --- 響應式調整 --- */
        @media (max-width: 768px) {
            #reader-content { padding: 20px 20px; }
            #toolbar { gap: 8px; padding: 8px; justify-content: center; }
            .control-group { gap: 5px; }
            label span { display: none; } /* 手機隱藏標籤文字 */
            #search-panel { width: 100%; right: -100%; border-left: none; }
            button, .file-btn { padding: 4px 8px; font-size: 12px; }
            #char-info { display: none; }
        }
    </style>
</head>
<body>

    <!-- 工具列 -->
    <header id="toolbar" aria-label="閱讀工具列">
        <div class="control-group">
            <label class="file-btn">
                開啟
                <input type="file" id="fileInput" accept=".txt">
            </label>
            <span id="fileNameDisplay" style="font-size: 12px; color: var(--ui-border); max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">未選擇</span>
        </div>

        <div class="control-group">
            <button onclick="saveManualBookmark()" title="儲存書籤" aria-label="儲存書籤">存</button>
            <button onclick="loadManualBookmark()" title="讀取書籤" aria-label="讀取最近書籤">讀</button>
        </div>
        
        <div class="control-group">
            <!-- TTS 按鈕 -->
            <button id="ttsBtn" onclick="toggleTTS()" title="朗讀/停止 (自動翻頁)">朗讀</button>
        </div>

        <div class="control-group">
            <label title="字體大小">A<input type="range" id="fontSizeRange" min="14" max="50" value="24" oninput="updateStyle()"></label>
            <label title="亮度調整">☀<input type="range" id="brightnessRange" min="0.2" max="1" step="0.1" value="1" oninput="updateStyle()"></label>
        </div>

        <div class="control-group">
            <button onclick="toggleSearch()" title="搜尋" aria-label="搜尋全文">🔍</button>
            <button onclick="toggleSettings()" title="閱讀設定" aria-label="開啟閱讀設定">⚙</button>
            <button id="prevBtn" onclick="manualTurnPage(-1)" aria-label="上一頁">◀</button>
            <button id="nextBtn" onclick="manualTurnPage(1)" aria-label="下一頁">▶</button>
        </div>
    </header>
    <section id="settings-panel" aria-label="閱讀設定">
        <label>編碼 <select id="encodingSelect"><option value="utf-8">UTF-8</option><option value="big5">Big5</option><option value="gb18030">GB18030</option><option value="utf-16le">UTF-16 LE</option><option value="utf-16be">UTF-16 BE</option></select></label>
        <label>主題 <select id="themeSelect"><option value="contrast">高對比</option><option value="dark">深色</option><option value="paper">紙張</option><option value="light">亮色</option></select></label>
        <label>模式 <select id="modeSelect"><option value="page">分頁</option><option value="scroll">捲動</option></select></label>
        <label>行距 <select id="lineHeightSelect"><option>1.4</option><option selected>1.6</option><option>1.8</option><option>2</option></select></label>
        <label>語速 <input type="range" id="rateRange" min="0.5" max="2" step="0.1" value="1"></label>
    </section>
    <div id="announcement" aria-live="polite"></div>

    <!-- 閱讀區 -->
    <main id="reader-wrapper">
        <div id="reader-content">
            <div style="margin-top: 10vh; text-align: center; color: #888;">
                <h2 style="color: var(--ui-border);">高對比 TXT 閱讀器</h2>
                <p>請點選左上角「開啟」載入小說</p>
                <hr style="border: 1px solid #333; width: 50%;">
                <ul style="text-align: left; display: inline-block;">
                    <li><b>朗讀功能</b>：點擊上方「朗讀」鍵，讀完自動翻頁</li>
                    <li><b>自適應排版</b>：無須上下捲動</li>
                    <li><b>進度跳轉</b>：修改左下角數字可跳轉</li>
                    <li><b>自動記憶</b>：關閉後再開自動回到上次進度</li>
                </ul>
            </div>
        </div>

        <!-- 搜尋側邊欄 -->
        <div id="search-panel">
            <div class="search-header">
                <input type="text" id="searchInput" placeholder="輸入關鍵字..." onkeydown="if(event.key==='Enter') performSearch()">
                <button onclick="performSearch()">搜尋</button>
                <button onclick="toggleSearch()">✕</button>
            </div>
            <div id="search-results">
                <div style="text-align:center; padding:20px; color:#666;">請輸入關鍵字並按下搜尋</div>
            </div>
        </div>
    </main>

    <!-- 狀態列 -->
    <div id="statusbar">
        <div class="progress-control" title="點擊輸入數字可跳轉">
            <input type="number" id="progress-input" value="0.00" min="0" max="100" step="0.01">
            <span>%</span>
        </div>
        <span id="char-info">字元: 0 / 0</span>
    </div>

    <script>
        // --- 核心變數 ---
        let fullText = "";
        let currentIndex = 0;
        let currentFileName = "";
        let pageHistory = [];
        let fileLoadGeneration = 0;
        let currentFileBuffer = null;
        let currentBookId = "";
        
        // --- TTS 相關變數 ---
        let isTTSActive = false;
        let ttsSynth = window.speechSynthesis;
        let ttsVoice = null;
        let ttsUtterance = null;
        
        // --- DOM 元素 ---
        const readerContent = document.getElementById('reader-content');
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const progressInput = document.getElementById('progress-input');
        const charInfo = document.getElementById('char-info');
        const searchPanel = document.getElementById('search-panel');
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('search-results');
        const ttsBtn = document.getElementById('ttsBtn');
        const announcement = document.getElementById('announcement');
        const settingsPanel = document.getElementById('settings-panel');
        const encodingSelect = document.getElementById('encodingSelect');

        function announce(message) { announcement.textContent = message; }
        function toggleSettings() { settingsPanel.classList.toggle('open'); }

        async function createBookId(file, buffer) {
            if (window.crypto?.subtle) {
                const digest = await window.crypto.subtle.digest('SHA-256', buffer);
                return Array.from(new Uint8Array(digest), b => b.toString(16).padStart(2, '0')).join('');
            }
            return `${file.name}:${file.size}:${file.lastModified}`;
        }

        function decodeCurrentFile() {
            if (!currentFileBuffer) return '';
            try { return new TextDecoder(encodingSelect.value, { fatal:false }).decode(currentFileBuffer); }
            catch { return new TextDecoder('utf-8').decode(currentFileBuffer); }
        }

        function progressStorageKey() { return `txt_reader_v2_${currentBookId || currentFileName}`; }

        function resetReadingState() {
            currentIndex = 0;
            pageHistory = [];
            readerContent.dataset.charsOnPage = '0';
        }

        function normalizeCurrentIndex() {
            if (!fullText.length) {
                currentIndex = 0;
                return;
            }

            const parsedIndex = Number.parseInt(currentIndex, 10);
            currentIndex = Number.isFinite(parsedIndex)
                ? Math.min(Math.max(parsedIndex, 0), fullText.length - 1)
                : 0;
        }

        function showReaderMessage(title, message) {
            readerContent.replaceChildren();

            const container = document.createElement('div');
            container.style.marginTop = '10vh';
            container.style.textAlign = 'center';
            container.style.color = '#888';

            const heading = document.createElement('h2');
            heading.style.color = 'var(--ui-border)';
            heading.textContent = title;

            const description = document.createElement('p');
            description.textContent = message;

            container.append(heading, description);
            readerContent.appendChild(container);
        }

        // --- 1. 初始化與檔案讀取 ---
        
        // 嘗試載入語音 (Chrome 需要 onvoiceschanged)
        function initVoices() {
            const voices = ttsSynth.getVoices();
            // 優先找台灣繁體，其次中文，最後隨便一個
            ttsVoice = voices.find(v => v.lang === 'zh-TW') || 
                       voices.find(v => v.lang.startsWith('zh')) || 
                       voices[0];
        }
        initVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = initVoices;
        }

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            stopTTS(); // 換檔案時停止朗讀

            const loadGeneration = ++fileLoadGeneration;
            fullText = "";
            resetReadingState();

            currentFileName = file.name;
            fileNameDisplay.textContent = file.name;
            fileNameDisplay.title = file.name;
            showReaderMessage('載入中…', `正在開啟「${file.name}」`);
            updateStatus(0);

            const reader = new FileReader();
            reader.onload = async function(e) {
                // 使用者可能在檔案仍在讀取時又選擇另一本書。
                if (loadGeneration !== fileLoadGeneration) return;

                currentFileBuffer = e.target.result;
                currentBookId = await createBookId(file, currentFileBuffer);
                if (loadGeneration !== fileLoadGeneration) return;
                fullText = decodeCurrentFile();
                // 統一換行符號
                fullText = fullText.replace(/\r\n/g, '\n').replace(/\r/g, '\n').replace(/\t/g, '    ');

                resetReadingState();
                if (!fullText.length) {
                    showReaderMessage('空白檔案', '這個 TXT 檔案沒有可供閱讀的內容。');
                    updateStatus(0);
                    return;
                }

                loadAutoProgress();
                normalizeCurrentIndex();
                renderCurrentPage();
            };
            reader.onerror = function() {
                if (loadGeneration !== fileLoadGeneration) return;

                fullText = "";
                resetReadingState();
                showReaderMessage('無法開啟檔案', '讀取 TXT 檔案時發生錯誤，請重新選擇檔案。');
                updateStatus(0);
            };
            reader.readAsArrayBuffer(file);
        });

        encodingSelect.addEventListener('change', () => {
            if (!currentFileBuffer) return;
            const oldPercent = fullText.length ? currentIndex / fullText.length : 0;
            fullText = decodeCurrentFile().replace(/\r\n/g, '\n').replace(/\r/g, '\n').replace(/\t/g, '    ');
            currentIndex = Math.floor(oldPercent * fullText.length);
            pageHistory = [];
            renderCurrentPage();
            announce(`已切換為 ${encodingSelect.options[encodingSelect.selectedIndex].text} 編碼`);
        });

        // --- 2. TTS 朗讀邏輯 ---

        function toggleTTS() {
            if (!fullText) {
                alert("請先開啟檔案");
                return;
            }

            if (isTTSActive) {
                stopTTS();
            } else {
                startTTS();
            }
        }

        function startTTS() {
            if (isTTSActive) return; // 避免重複啟動
            
            isTTSActive = true;
            ttsBtn.textContent = "停止";
            ttsBtn.classList.add("reading-active");
            
            speakCurrentContent();
        }

        function stopTTS() {
            isTTSActive = false;
            ttsSynth.cancel(); // 立即停止發聲
            ttsBtn.textContent = "朗讀";
            ttsBtn.classList.remove("reading-active");
        }

        function speakCurrentContent() {
            if (!isTTSActive) return;

            // 確保先停止之前的
            ttsSynth.cancel();

            const textToRead = readerContent.textContent;
            if (!textToRead.trim()) return;

            ttsUtterance = new SpeechSynthesisUtterance(textToRead);
            if (ttsVoice) ttsUtterance.voice = ttsVoice;
            ttsUtterance.rate = Number(document.getElementById('rateRange').value); // 語速
            ttsUtterance.pitch = 1; // 音調

            // 當本頁讀完時的事件
            ttsUtterance.onend = function() {
                // 只有在「仍然是啟用狀態」時才翻頁
                // 如果是使用者按了停止，isTTSActive 會是 false，這段就不會執行
                if (isTTSActive) {
                    // 檢查是否還有下一頁
                    const charsOnPage = parseInt(readerContent.dataset.charsOnPage || 0);
                    if (currentIndex + charsOnPage < fullText.length) {
                        // 1. 自動翻頁 (使用 true 參數代表這是自動翻頁，不要停止 TTS)
                        turnPage(1, true);
                        
                        // 2. 稍微延遲一點點再讀下一頁，比較自然
                        setTimeout(() => {
                            if (isTTSActive) speakCurrentContent();
                        }, 500);
                    } else {
                        stopTTS(); // 讀完了
                    }
                }
            };

            ttsUtterance.onerror = function(e) {
                console.error("TTS Error:", e);
                stopTTS();
            };

            ttsSynth.speak(ttsUtterance);
        }

        // --- 3. 核心翻頁與排版 ---

        function renderCurrentPage() {
            if (!fullText) return;

            normalizeCurrentIndex();

            if (document.body.dataset.mode === 'scroll') {
                readerContent.textContent = fullText;
                readerContent.dataset.charsOnPage = fullText.length;
                updateStatus(fullText.length - currentIndex);
                saveAutoProgress();
                return;
            }

            readerContent.innerHTML = "";
            
            const tempSpan = document.createElement('span');
            readerContent.appendChild(tempSpan);
            
            const maxCharsToCheck = 4000;
            const remainingTextLen = fullText.length - currentIndex;
            const limit = Math.min(remainingTextLen, maxCharsToCheck);
            
            let low = 0;
            let high = limit;
            let fitIndex = 0;
            const maxHeight = readerContent.clientHeight;

            while (low <= high) {
                const mid = Math.floor((low + high) / 2);
                tempSpan.textContent = fullText.substr(currentIndex, mid);
                
                if (readerContent.scrollHeight > maxHeight) {
                    high = mid - 1;
                } else {
                    fitIndex = mid;
                    low = mid + 1;
                }
            }

            // 智慧斷句
            if (currentIndex + fitIndex < fullText.length) {
                const buffer = Math.min(fitIndex, 60);
                const rawSub = fullText.substr(currentIndex, fitIndex);
                let lastBreak = rawSub.lastIndexOf('\n');
                
                if (lastBreak === -1 || lastBreak < fitIndex - buffer) {
                     const lastPunctuation = Math.max(
                        rawSub.lastIndexOf('。'), rawSub.lastIndexOf('！'), 
                        rawSub.lastIndexOf('？'), rawSub.lastIndexOf('”'), rawSub.lastIndexOf('」')
                    );
                    if (lastPunctuation > fitIndex - buffer) lastBreak = lastPunctuation;
                }
                if (lastBreak > fitIndex - buffer) fitIndex = lastBreak + 1;
            }

            if (fitIndex === 0 && remainingTextLen > 0) fitIndex = 1;

            const pageText = fullText.substr(currentIndex, fitIndex);
            readerContent.textContent = pageText;
            
            updateStatus(fitIndex);
            saveAutoProgress();
            
            readerContent.dataset.charsOnPage = fitIndex;
        }

        function updateStatus(charsOnPage) {
            const total = fullText.length;
            const safeCharsOnPage = Number.isFinite(Number(charsOnPage))
                ? Math.max(0, Number(charsOnPage))
                : 0;
            let percent = 0;
            if (total > 0) percent = ((currentIndex + safeCharsOnPage) / total * 100).toFixed(2);
            progressInput.value = percent;
            charInfo.textContent = `字元: ${currentIndex} / ${total}`;
            
            document.getElementById('prevBtn').disabled = (currentIndex === 0);
            document.getElementById('nextBtn').disabled = (currentIndex + safeCharsOnPage >= total);
        }

        // 手動翻頁 (會停止 TTS)
        function manualTurnPage(direction) {
            stopTTS(); // 手動操作強制停止朗讀
            turnPage(direction, false);
        }

        // 核心翻頁函式
        // isAutoTurn: 如果是 TTS 自動呼叫的，傳入 true，這樣就不會被視為手動操作
        function turnPage(direction, isAutoTurn = false) {
            if (!fullText) return;

            if (direction === 1) {
                const charsOnPage = parseInt(readerContent.dataset.charsOnPage || 0);
                if (currentIndex + charsOnPage >= fullText.length) return;

                pageHistory.push(currentIndex);
                currentIndex += charsOnPage;
                renderCurrentPage();

            } else if (direction === -1) {
                if (pageHistory.length > 0) {
                    currentIndex = pageHistory.pop();
                    renderCurrentPage();
                } else if (currentIndex > 0) {
                    const approximateChars = Math.floor((readerContent.clientWidth * readerContent.clientHeight) / (parseInt(getComputedStyle(readerContent).fontSize) ** 2));
                    let targetIndex = Math.max(0, currentIndex - Math.floor(approximateChars * 0.8));
                    currentIndex = targetIndex;
                    pageHistory = []; 
                    renderCurrentPage();
                }
            }
        }

        // --- 4. 進度控制與記憶 ---
        
        progressInput.addEventListener('change', function() {
            stopTTS(); // 跳轉進度也算手動操作
            if (!fullText) { this.value = "0.00"; return; }
            
            let val = parseFloat(this.value);
            if (isNaN(val)) val = 0;
            if (val < 0) val = 0; if (val > 100) val = 100;
            
            const newIndex = Math.floor((val / 100) * fullText.length);
            currentIndex = newIndex;
            normalizeCurrentIndex();
            
            pageHistory = [];
            renderCurrentPage();
            this.blur(); 
        });

        progressInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') this.blur();
        });

        function saveAutoProgress() {
            if (currentFileName) localStorage.setItem(progressStorageKey(), JSON.stringify({ version:2, bookId:currentBookId, fileName:currentFileName, position:currentIndex, updatedAt:new Date().toISOString() }));
        }

        function loadAutoProgress() {
            if (currentFileName) {
                const saved = localStorage.getItem(progressStorageKey());
                const legacy = localStorage.getItem('txt_auto_' + currentFileName);
                if (saved !== null || legacy !== null) {
                    try { currentIndex = saved !== null ? JSON.parse(saved).position : Number.parseInt(legacy, 10); }
                    catch { currentIndex = 0; }
                    normalizeCurrentIndex();
                    pageHistory = [];
                }
            }
        }

        function saveManualBookmark() {
            if (!currentFileName) { alert("請先開啟檔案"); return; }
            localStorage.setItem('txt_manual_' + progressStorageKey(), currentIndex);
            alert(`✅ 書籤已儲存！進度: ${progressInput.value}%`);
        }

        function loadManualBookmark() {
            stopTTS(); // 讀取書籤停止朗讀
            if (!currentFileName) { alert("請先開啟檔案"); return; }
            const savedIdx = localStorage.getItem('txt_manual_' + progressStorageKey()) ?? localStorage.getItem('txt_manual_' + currentFileName);
            if (savedIdx !== null) {
                const idx = parseInt(savedIdx);
                if (confirm(`找到書籤 (位置: ${idx})，跳轉？`)) {
                    currentIndex = idx;
                    pageHistory = [];
                    renderCurrentPage();
                }
            } else {
                alert("無書籤");
            }
        }

        // --- 5. 搜尋功能 ---
        function toggleSearch() {
            searchPanel.classList.toggle('open');
            if (searchPanel.classList.contains('open')) {
                searchInput.focus();
                searchInput.select();
            }
        }

        function performSearch() {
            const keyword = searchInput.value.trim();
            if (!keyword || !fullText) return;

            searchResults.innerHTML = '';
            const searchingDiv = document.createElement('div');
            searchingDiv.style.padding = '10px';
            searchingDiv.style.color = '#888';
            searchingDiv.textContent = '搜尋中...';
            searchResults.appendChild(searchingDiv);
            
            setTimeout(() => {
                const results = [];
                let pos = fullText.indexOf(keyword);
                let count = 0;
                
                while (pos !== -1 && count < 100) {
                    const start = Math.max(0, pos - 15);
                    const end = Math.min(fullText.length, pos + keyword.length + 20);
                    let snippet = fullText.substring(start, end);
                    results.push({ index: pos, snippet: snippet, keyword: keyword });
                    pos = fullText.indexOf(keyword, pos + 1);
                    count++;
                }
                displayResults(results, keyword);
            }, 50);
        }

        function displayResults(results, keyword) {
            searchResults.innerHTML = '';
            if (results.length === 0) {
                const noResultDiv = document.createElement('div');
                noResultDiv.style.padding = '10px';
                noResultDiv.textContent = `找不到 "${keyword}"`;
                searchResults.appendChild(noResultDiv);
                return;
            }

            const infoDiv = document.createElement('div');
            infoDiv.style.padding = "10px";
            infoDiv.style.color = "#888";
            infoDiv.style.fontSize = "12px";
            infoDiv.textContent = `前 ${results.length} 筆結果：`;
            searchResults.appendChild(infoDiv);

            results.forEach(item => {
                const div = document.createElement('div');
                div.className = 'result-item';

                // 添加前綴
                const prefix = document.createTextNode('...');
                div.appendChild(prefix);

                // 分割並高亮關鍵字
                const parts = item.snippet.split(item.keyword);
                for (let i = 0; i < parts.length; i++) {
                    div.appendChild(document.createTextNode(parts[i]));
                    if (i < parts.length - 1) {
                        const highlight = document.createElement('span');
                        highlight.className = 'result-highlight';
                        highlight.textContent = item.keyword;
                        div.appendChild(highlight);
                    }
                }

                // 添加後綴
                const suffix = document.createTextNode('...');
                div.appendChild(suffix);

                // 添加換行和位置
                const br = document.createElement('br');
                div.appendChild(br);
                const posSpan = document.createElement('span');
                posSpan.style.color = '#555';
                posSpan.style.fontSize = '12px';
                posSpan.textContent = `位置: ${item.index}`;
                div.appendChild(posSpan);

                div.onclick = () => {
                    stopTTS(); // 搜尋跳轉停止朗讀
                    currentIndex = item.index;
                    pageHistory = [];
                    renderCurrentPage();
                    if (window.innerWidth < 768) toggleSearch();
                };
                searchResults.appendChild(div);
            });
        }

        // --- 6. 樣式與事件監聽 ---
        function updateStyle() {
            const fontSize = document.getElementById('fontSizeRange').value;
            const brightness = document.getElementById('brightnessRange').value;
            document.documentElement.style.setProperty('--font-size', fontSize + 'px');
            document.documentElement.style.setProperty('--brightness', brightness);
            renderCurrentPage();
        }

        function applyPreferences() {
            document.body.dataset.theme = document.getElementById('themeSelect').value;
            document.body.dataset.mode = document.getElementById('modeSelect').value;
            document.documentElement.style.setProperty('--line-height', document.getElementById('lineHeightSelect').value);
            localStorage.setItem('txt_reader_preferences', JSON.stringify({ theme:document.body.dataset.theme, mode:document.body.dataset.mode, lineHeight:document.getElementById('lineHeightSelect').value, fontSize:document.getElementById('fontSizeRange').value, rate:document.getElementById('rateRange').value }));
            pageHistory = [];
            renderCurrentPage();
        }

        ['themeSelect','modeSelect','lineHeightSelect'].forEach(id => document.getElementById(id).addEventListener('change', applyPreferences));
        document.getElementById('rateRange').addEventListener('change', applyPreferences);
        try {
            const prefs = JSON.parse(localStorage.getItem('txt_reader_preferences') || '{}');
            if (prefs.theme) document.getElementById('themeSelect').value = prefs.theme;
            if (prefs.mode) document.getElementById('modeSelect').value = prefs.mode;
            if (prefs.lineHeight) document.getElementById('lineHeightSelect').value = prefs.lineHeight;
            if (prefs.fontSize) document.getElementById('fontSizeRange').value = prefs.fontSize;
            if (prefs.rate) document.getElementById('rateRange').value = prefs.rate;
        } catch {}
        document.body.dataset.theme = document.getElementById('themeSelect').value;
        document.body.dataset.mode = document.getElementById('modeSelect').value;
        document.documentElement.style.setProperty('--line-height', document.getElementById('lineHeightSelect').value);

        let pointerStart = null;
        readerContent.addEventListener('pointerdown', e => { pointerStart = { x:e.clientX, y:e.clientY }; });
        readerContent.addEventListener('pointerup', e => {
            if (!pointerStart || window.getSelection()?.toString()) return;
            const dx = e.clientX - pointerStart.x;
            const dy = e.clientY - pointerStart.y;
            pointerStart = null;
            if (document.body.dataset.mode !== 'page' || Math.abs(dy) > Math.abs(dx)) return;
            if (Math.abs(dx) > 50) manualTurnPage(dx < 0 ? 1 : -1);
            else if (e.clientX < window.innerWidth * .3) manualTurnPage(-1);
            else if (e.clientX > window.innerWidth * .7) manualTurnPage(1);
            else document.getElementById('toolbar').classList.toggle('hidden');
        });

        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                renderCurrentPage();
            }, 100);
        });

        document.addEventListener('keydown', function(e) {
            const active = document.activeElement;
            if ((searchPanel.classList.contains('open') && active === searchInput) || active === progressInput) return;

            if (e.key === 'ArrowLeft') {
                manualTurnPage(-1);
            } else if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault(); 
                manualTurnPage(1);
            }
        });

        updateStyle();

    </script>
</body>
